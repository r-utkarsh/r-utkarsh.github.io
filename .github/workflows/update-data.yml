# Daily refresh of the GitHub-derived parts of data.json:
#   - contributions calendar  (scripts/update-contributions.mjs)
#   - most recent push        (scripts/update-last-push.mjs)
# and commit the result back to the repo. Does nothing until this file is pushed to GitHub.
#
# Optional secret CONTRIB_TOKEN: a personal access token (no scopes needed for public data).
# If it is not set, update-contributions.mjs falls back to reading the public calendar page.

name: Update GitHub data

on:
  schedule:
    - cron: '17 1 * * *'   # every day, 01:17 UTC
  workflow_dispatch:        # lets you run it by hand from the Actions tab

permissions:
  contents: write           # needed to commit data.json back

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Update contribution calendar
        env:
          GITHUB_TOKEN: ${{ secrets.CONTRIB_TOKEN }}
        run: node scripts/update-contributions.mjs

      - name: Update last push
        if: ${{ !cancelled() }}   # still run if the calendar step failed
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/update-last-push.mjs

      - name: Commit data.json
        if: ${{ !cancelled() }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          if git diff --cached --quiet; then
            echo "data.json unchanged"
          else
            git commit -m "chore: refresh GitHub data"
            git push
          fi
